<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeCraft</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,600&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --navy: #10233a;
            --panel: #17324f;
            --ink: #e7f1f8;
            --muted: #8fb0c4;
            --line: #2c5470;
            --cyan: #6ec8dc;
            --brass: #c9922a;
            --danger: #d4655a;
            --ok: #6fbf8a;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
        }

        body {
            margin: 0;
            background:
                linear-gradient(180deg, rgba(110, 200, 220, 0.05), transparent 28%),
                repeating-linear-gradient(0deg, transparent, transparent 31px, rgba(110, 200, 220, 0.06) 32px),
                repeating-linear-gradient(90deg, transparent, transparent 31px, rgba(110, 200, 220, 0.06) 32px),
                var(--navy);
            color: var(--ink);
            font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
        }

        button,
        input,
        textarea,
        select {
            font: inherit;
        }

        button:focus-visible,
        input:focus-visible,
        textarea:focus-visible,
        select:focus-visible {
            outline: 2px solid var(--cyan);
            outline-offset: 2px;
        }

        .view {
            min-height: 100%;
            padding: 28px;
        }

        .view[hidden] {
            display: none;
        }

        .masthead {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 16px;
            margin-bottom: 24px;
        }

        .wordmark {
            font-family: "Source Serif 4", Georgia, serif;
            font-size: 1.8rem;
            font-weight: 600;
            margin: 0;
            letter-spacing: -0.03em;
        }

        .lede {
            margin: 6px 0 0;
            color: var(--muted);
            max-width: 42rem;
        }

        .studio-grid {
            display: grid;
            grid-template-columns: minmax(280px, 380px) 1fr;
            gap: 20px;
            align-items: start;
        }

        .panel {
            background: rgba(23, 50, 79, 0.92);
            border: 1px solid var(--line);
            padding: 20px;
        }

        label {
            display: block;
            color: var(--muted);
            font-size: 0.92rem;
            font-weight: 500;
            margin-bottom: 6px;
        }

        input[type="text"],
        input[type="password"],
        textarea,
        select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--line);
            background: #0f2134;
            color: var(--ink);
            margin-bottom: 14px;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        .option {
            display: flex;
            gap: 8px;
            align-items: flex-start;
            margin-bottom: 10px;
            color: var(--ink);
        }

        .option small {
            display: block;
            color: var(--muted);
            font-size: 0.78rem;
            margin-top: 2px;
        }

        .btn-brass,
        .btn-cyan,
        .btn-ghost {
            border: 0;
            cursor: pointer;
            padding: 12px 16px;
            font-weight: 600;
        }

        .btn-brass {
            width: 100%;
            background: var(--brass);
            color: #1a1406;
            margin-top: 8px;
        }

        .btn-brass:disabled,
        .btn-cyan:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        .btn-cyan {
            background: var(--cyan);
            color: #10233a;
        }

        .btn-ghost {
            background: transparent;
            color: var(--cyan);
            border: 1px solid var(--cyan);
        }

        .plotter {
            min-height: 420px;
            max-height: calc(100vh - 180px);
            overflow: auto;
            background: #07131f;
            color: var(--cyan);
            font-family: "IBM Plex Mono", Consolas, monospace;
            font-size: 0.86rem;
            line-height: 1.45;
            padding: 16px;
            white-space: pre-wrap;
            border: 1px solid var(--line);
        }

        .projects h2 {
            font-size: 1rem;
            font-weight: 600;
            margin: 0 0 10px;
        }

        .project-list {
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .project-list button {
            width: 100%;
            text-align: left;
            background: transparent;
            border: 0;
            border-bottom: 1px solid var(--line);
            color: var(--ink);
            padding: 10px 0;
            cursor: pointer;
        }

        .project-list button:hover {
            color: var(--cyan);
        }

        .empty {
            color: var(--muted);
            margin: 0;
        }

        .workspace-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        .workspace-bar h1 {
            font-family: "Source Serif 4", Georgia, serif;
            font-size: 1.5rem;
            margin: 0;
        }

        .bar-actions {
            display: flex;
            gap: 8px;
        }

        .files {
            color: var(--muted);
            font-size: 0.85rem;
            margin: 0 0 12px;
        }

        .edit-bar {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }

        .edit-bar input {
            flex: 1;
            margin: 0;
        }

        .pulse {
            animation: pulse 1.4s ease-in-out infinite;
        }

        @keyframes pulse {
            50% {
                opacity: 0.65;
            }
        }

        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(7, 19, 31, 0.72);
            justify-content: center;
            align-items: center;
            z-index: 20;
        }

        .modal {
            background: var(--panel);
            border: 1px solid var(--line);
            padding: 22px;
            width: min(480px, 92vw);
        }

        .option-btn {
            display: block;
            width: 100%;
            text-align: left;
            margin-bottom: 8px;
            background: #0f2134;
            color: var(--ink);
            border: 1px solid var(--line);
            padding: 10px;
            cursor: pointer;
        }

        @media (max-width: 860px) {
            .studio-grid,
            .workspace-bar,
            .edit-bar {
                display: block;
            }

            .bar-actions,
            .edit-bar button {
                width: 100%;
                margin-top: 8px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .pulse {
                animation: none;
            }
        }
    </style>
</head>

<body>
    <!-- 工作台：填写需求并开始生成。用户层面：从一句话走到可下载、可继续改的项目。 -->
    <section class="view" id="studio">
        <header class="masthead">
            <div>
                <h1 class="wordmark">CodeCraft</h1>
                <p class="lede">用一句话描述应用。生成结束后会进入这个项目的修改页；以前做过的项目也可以从下面打开。</p>
            </div>
        </header>
        <div class="studio-grid">
            <div>
                <form class="panel" id="generateForm">
                    <label for="apiKey">DeepSeek API Key</label>
                    <input type="password" id="apiKey" autocomplete="off" placeholder="sk-...">

                    <label for="description">想做什么</label>
                    <textarea id="description" placeholder="例如：带深色模式的待办清单"></textarea>

                    <label for="outputDir">项目文件夹（可空，交给系统起名）</label>
                    <input type="text" id="outputDir" placeholder="todo-list">

                    <label for="lang">生成项目的界面语言</label>
                    <select id="lang">
                        <option value="zh">中文</option>
                        <option value="en">English</option>
                    </select>

                    <label class="option"><input type="checkbox" id="install" checked> 自动安装依赖
                        <small>生成后执行 npm install，方便马上运行</small>
                    </label>
                    <label class="option"><input type="checkbox" id="test" checked> 自动编译检查
                        <small>若项目有 build 脚本，会试着编译并提示失败原因</small>
                    </label>
                    <label class="option"><input type="checkbox" id="force"> 覆盖已有文件夹
                        <small>只在你确实要重做同名项目时勾选</small>
                    </label>

                    <button type="submit" class="btn-brass" id="generateBtn">开始生成</button>
                </form>
                <div class="panel projects" style="margin-top: 16px;">
                    <h2>以前的项目</h2>
                    <p class="empty" id="projectEmpty">还没有可打开的项目。生成一次之后会出现在这里。</p>
                    <ul class="project-list" id="projectList"></ul>
                </div>
            </div>
            <div class="plotter" id="studioLog">等待需求。生成过程会写在这张图纸上。</div>
        </div>
    </section>

    <!-- 修改页：对着刚生成或以前打开的项目继续改。用户层面：生成结束后会进到这里，也能从列表拿回旧项目。 -->
    <section class="view" id="workspace" hidden>
        <div class="workspace-bar">
            <div>
                <h1 id="workspaceTitle">修改项目</h1>
                <p class="files" id="workspaceFiles"></p>
            </div>
            <div class="bar-actions">
                <button type="button" class="btn-ghost" id="backBtn">返回工作台</button>
                <button type="button" class="btn-cyan" id="runBtn">在本机运行</button>
            </div>
        </div>
        <div class="plotter" id="workspaceLog"></div>
        <div class="edit-bar">
            <input type="text" id="patchMsg" placeholder="例如：加一个购物车，或把按钮改成绿色">
            <button type="button" class="btn-cyan" id="patchBtn">应用修改</button>
        </div>
    </section>

    <div class="modal-overlay" id="reviewerModal">
        <div class="modal">
            <h3>需要你选一下</h3>
            <p id="reviewerMsg"></p>
            <div id="reviewerOptions"></div>
            <button type="button" class="btn-ghost" id="ignoreReviewer">忽略并继续</button>
        </div>
    </div>

    <script src="/app.js"></script>
</body>

</html>
